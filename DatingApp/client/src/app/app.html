<div class="card bg-base-100 w-1/2 mx-auto px-10 shadow-xl">
  <h3 class="text-3xl text-red-500 font-blod">Members</h3>
<ul class="lsit">
  @for(member of members(); track member.id) {
    <li clas="list-row item-center">
    <img src="/user.png" alt="avatar" class = "size-12 rounded-box">
    <div>
      {{member.displayName}}
    </div>
    </li>
  }
</ul>
</div>
